version: '3.8'

services:
  app:
    container_name: rpl-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    env_file:
      - .env
    depends_on:
      - db

  db:
    container_name: rpl-db
    image: postgres:latest
    env_file:
      - .env
    ports:
      - ${DATABASE_PORT}:${DATABASE_PORT}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: